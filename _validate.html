<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>stroke validate</title></head>
<body><canvas id="cv" width="1000" height="1000"></canvas>
<script src="./strokes-data.js"></script>
<script>
const LINE = 46, S = 1000;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const D = window.MP_STROKES;
let hit = 0, tot = 0; const missed = [];
for (const [ch, v] of Object.entries(D)) {
  for (const s of v.strokes) {
    ctx.beginPath();
    ctx.lineWidth = LINE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (const p of s.pts.slice(1)) ctx.lineTo(p[0], p[1]);
    for (let i = 0; i < s.pts.length - 1; i++) {
      const a = s.pts[i], b = s.pts[i+1];
      const n = Math.max(2, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / 10));
      for (let k = 0; k <= n; k++) {
        const x = a[0] + (b[0]-a[0])*k/n, y = a[1] + (b[1]-a[1])*k/n;
        tot++;
        if (ctx.isPointInStroke(x, y)) hit++;
        else if (missed.length < 10) missed.push(ch+'/'+s.name+' @'+x.toFixed(0)+','+y.toFixed(0));
      }
    }
  }
}
// negative control: far-off points must NOT hit
let fp = 0;
for (const [ch, v] of Object.entries(D)) {
  for (const s of v.strokes) {
    ctx.beginPath(); ctx.lineWidth = LINE; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for (const p of s.pts.slice(1)) ctx.lineTo(p[0], p[1]);
    // point 150px perpendicular-ish away from midpoint should be outside
    const a = s.pts[0], b = s.pts[s.pts.length-1];
    const mx = (a[0]+b[0])/2 + 300, my = (a[1]+b[1])/2 + 300;
    if (ctx.isPointInStroke(mx, my)) fp++;
  }
}
document.title = 'RESULT ' + hit + '/' + tot + ' (' + (100*hit/tot).toFixed(2) + '%) fp=' + fp +
  ' missed=' + (missed.join(' ')||'none');
</script></body></html>
