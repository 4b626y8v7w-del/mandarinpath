<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>contact sheet</title>
<style>body{background:#fff;margin:0;font:12px sans-serif}
.g{display:grid;grid-template-columns:repeat(10,90px);gap:2px;padding:4px}
.c{text-align:center}
canvas{border:1px solid #eee}
.lab{font-size:13px;color:#333}</style></head>
<body><div class="g" id="g"></div>
<script src="./strokes-data.js"></script>
<script>
const g = document.getElementById('g');
for (const [ch, v] of Object.entries(window.MP_STROKES)) {
  const d = document.createElement('div'); d.className = 'c';
  const cv = document.createElement('canvas');
  cv.width = 88; cv.height = 88;
  const ctx = cv.getContext('2d');
  const k = 88/1000;
  // light grid
  ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5,0.5,87,87);
  ctx.beginPath();
  ctx.moveTo(44,0); ctx.lineTo(44,88); ctx.moveTo(0,44); ctx.lineTo(88,44);
  ctx.strokeStyle = '#eee'; ctx.stroke();
  const cols = ['#c00','#06c','#090','#c60','#909','#c0c','#088','#a00','#555','#0aa'];
  v.strokes.forEach((s, i) => {
    ctx.beginPath();
    ctx.strokeStyle = cols[i % cols.length];
    ctx.lineWidth = 3.5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.moveTo(s.pts[0][0]*k, s.pts[0][1]*k);
    for (const p of s.pts.slice(1)) ctx.lineTo(p[0]*k, p[1]*k);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = cols[i % cols.length];
    ctx.arc(s.pts[0][0]*k, s.pts[0][1]*k, 2.6, 0, 7); ctx.fill();
  });
  d.appendChild(cv);
  const l = document.createElement('div'); l.className='lab'; l.textContent = ch;
  d.appendChild(l);
  g.appendChild(d);
}
document.title = 'DONE ' + Object.keys(window.MP_STROKES).length;
</script></body></html>
